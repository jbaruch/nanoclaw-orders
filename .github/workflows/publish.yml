name: Review & Publish Plugin

# Thin caller for the canonical fleet publish pipeline
# (jbaruch/coding-policy#206). All steps live in the reusable workflow;
# this file carries only the triggers and this repo's inputs. The display
# name changed with the plugin-manifest migration (jbaruch/nanoclaw-core#97).
# Watchers match this run by workflow FILE, never by display name — see
# jbaruch/nanoclaw-host#50 for what name-matching broke.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The reusable workflow's own permissions are capped by what the caller
# grants — declare the publish pipeline's needs explicitly.
permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  publish:
    # This reusable-workflow SHA pin is renewed weekly by .github/dependabot.yml
    # (github-actions ecosystem), per dependency-management Freshness.
    uses: jbaruch/coding-policy/.github/workflows/publish-plugin.yml@af116ebf18a7c46a672bf176064908736bc8ac28
    # Forward only the token the reusable workflow declares (not `inherit`).
    secrets:
      TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
    with:
      stamp-changelog: true
      skill-review-credit-outage: skip